import net.fabricmc.loom.task.DownloadTask

plugins {
    alias(libs.plugins.loom)
}

def modId = project.property("mod_id").toString()
def modName = project.property("mod_name").toString()
def modVersion = project.property("mod_version").toString()
def mavenGroup = project.property("maven_group").toString()
def minimumMcVersion = project.property("min_minecraft_version").toString()

base.archivesName.set(modId)
version = "$modVersion"
group = mavenGroup

repositories {
    mavenLocal()
}

dependencies {
    // To change the versions, see at `libs.versions.toml` file
    // Fabric
    minecraft(libs.minecraft)
    implementation(libs.fabric.loader)

    // Fabric API
    implementation(libs.fabric.api)

    // EdenMC API
    implementation(libs.edenmc.api)

    // Adventure
    include(libs.adventure.api)
    include(libs.adventure.fabric)
    implementation(libs.adventure.api)
    implementation(libs.adventure.fabric)
}

tasks.jar {
    from("LICENSE")
}

tasks.processResources {
    inputs.property("id", modId)
    inputs.property("name", modName)
    inputs.property("version", modVersion)

    filteringCharset = "UTF-8"
    filesMatching('fabric.mod.json') {
        expand([
            mod_id: modId,
            mod_name: modName,
            mod_version: modVersion,
            fabric_loader_version: libs.versions.fabric.loader.get(),
            min_minecraft_version: minimumMcVersion
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.register("downloadEden", DownloadTask) {
    url = "https://github.com/Dystopiko/eden-minecraft/releases/download/v1.2.8/eden-1.2.8.jar"
    output = file("run/mods/Eden.jar")
}

tasks.register("downloadFabricKotlin", DownloadTask) {
    url = "https://cdn.modrinth.com/data/Ha28R6CL/versions/2i87JpYj/fabric-language-kotlin-1.13.11%2Bkotlin.2.3.21.jar?mr_download_reason=standalone&mr_game_version=26.1.2&mr_loader=fabric"
    output = file("run/mods/FabricKotlin.jar")
}

tasks.register("downloadFloodgate", DownloadTask) {
    url = "https://cdn.modrinth.com/data/bWrNNfkb/versions/fD4J9lnX/Floodgate-Fabric-2.2.6-b63.jar?mr_download_reason=standalone&mr_game_version=26.1.2&mr_loader=fabric"
    output = file("run/mods/Floodgate.jar")
}

tasks.register("downloadGeyser", DownloadTask) {
    url = "https://cdn.modrinth.com/data/wKkoqHrH/versions/q4Pg0AcC/Geyser-Fabric-2.10.0-b1138.jar?mr_download_reason=standalone&mr_game_version=26.1.2&mr_loader=fabric"
    output = file("run/mods/Geyser.jar")
}

tasks.register("downloadLuckPerms", DownloadTask) {
    url = "https://cdn.modrinth.com/data/Vebnzrzj/versions/fTIdfb46/LuckPerms-Fabric-5.5.42.jar?mr_download_reason=standalone&mr_game_version=26.1.2&mr_loader=fabric"
    output = file("run/mods/LuckPerms.jar")
}

tasks.register("downloadRequiredMods").configure {
    dependsOn(tasks.named("downloadEden"))
    dependsOn(tasks.named("downloadFabricKotlin"))
    dependsOn(tasks.named("downloadFloodgate"))
    dependsOn(tasks.named("downloadGeyser"))
    dependsOn(tasks.named("downloadLuckPerms"))
}

tasks.named("runServer").configure {
    dependsOn(tasks.named("downloadRequiredMods"))
}
